[package]
name = "nirvana-core"
version = "0.1.0"
edition = "2021"
description = "Rust-based columnar storage manager for nirvana DataFrame"
license = "MIT"

[lib]
name = "nirvana_core"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.24", features = ["extension-module"] }

# Arrow as the core in-memory columnar format
arrow = { version = "55.0", features = ["pyarrow"] }

# File format support
parquet = "55.0"
csv = "1.3"
calamine = "0.28"

# Async runtime for potential S3/network operations
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }

# Error handling
thiserror = "2.0"

# Base64 for media encoding
base64 = "0.22"

# HTTP client for fetching remote media
reqwest = { version = "0.12", features = ["blocking"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Rayon for parallel processing
rayon = "1.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
